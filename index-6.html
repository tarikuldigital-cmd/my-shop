<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শপঘর অনলাইন শপ</title>
<meta name="description" content="সব ধরনের প্রোডাক্ট এক জায়গায়। সারা বাংলাদেশে হোম ডেলিভারি ও ক্যাশ অন ডেলিভারি।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: marketplace storefront (category rail + dense product grid) and an operations-style admin (left rail, information panels) */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface2:#ebefed; --ink:#18201d; --muted:#5b6762; --line:#d8dfdb;
  --brand:#0b6b52; --brand-ink:#ffffff; --brand-soft:#dcefe8; --accent:#e0761b;
  --good:#1d7a3e; --warn:#a86300; --bad:#b3261e; --info:#1f5fa8; --hold:#7a4fb0;
  --font-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --surface:#18201d; --surface2:#212a26; --ink:#e6ece9; --muted:#9aa8a1; --line:#2b3531;
    --brand:#3fbf98; --brand-ink:#08140f; --brand-soft:#17332a; --accent:#f0954a;
    --good:#5cc382; --warn:#e0a640; --bad:#ef6b61; --info:#72a9ef; --hold:#b592e6;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#18201d; --surface2:#212a26; --ink:#e6ece9; --muted:#9aa8a1; --line:#2b3531;
  --brand:#3fbf98; --brand-ink:#08140f; --brand-soft:#17332a; --accent:#f0954a;
  --good:#5cc382; --warn:#e0a640; --bad:#ef6b61; --info:#72a9ef; --hold:#b592e6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hide{display:none!important}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:9px 16px;border-radius:8px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.plain{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.iconbtn{border:0;background:transparent;padding:6px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;color:inherit;text-decoration:none}
.iconbtn:hover{background:var(--surface2)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;min-height:72px}
.err{color:var(--bad);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.pill.info2{color:var(--brand);background:color-mix(in srgb,var(--brand) 13%,transparent)}
.pill.transit{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pill.hold{color:var(--hold);background:color-mix(in srgb,var(--hold) 13%,transparent)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pill.bad2{color:var(--bad);background:transparent;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.demo-note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 10px}

/* ===== storefront ===== */
.announce{background:var(--brand);color:var(--brand-ink);font-size:13.5px;text-align:center;padding:6px 16px}
.topbar{border-bottom:1px solid var(--line);background:var(--surface);font-size:13.5px}
.topbar .wrap{display:flex;justify-content:space-between;gap:4px;padding-top:4px;padding-bottom:4px;flex-wrap:wrap;align-items:center}
.topbar nav{display:flex;gap:2px;flex-wrap:wrap}
.topbar a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px}
.topbar a:hover{color:var(--ink);background:var(--surface2)}
.topbar .admin-link{color:var(--brand);font-weight:600}
header.shop{background:var(--surface);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line)}
.hmain{display:flex;align-items:center;gap:18px;padding-top:12px;padding-bottom:12px}
.logo{font-size:24px;font-weight:700;color:var(--brand);text-decoration:none;display:flex;align-items:center;gap:9px;white-space:nowrap;letter-spacing:-.01em}
.logo .mark{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center}
.logo img{height:36px;width:auto}
.search{flex:1;display:flex;border:1.5px solid var(--brand);border-radius:999px;overflow:hidden;background:var(--surface);max-width:640px}
.search input{border:0;background:transparent;padding:10px 16px;flex:1;min-width:0}
.search input:focus{outline:none}
.search button{border:0;background:var(--brand);color:var(--brand-ink);padding:0 18px;font-weight:600}
.hicons{display:flex;gap:4px;align-items:center}
.hicon{position:relative;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink);text-decoration:none;border:0;background:none;padding:4px 8px;border-radius:8px}
.hicon:hover{background:var(--surface2)}
.hicon .badge{position:absolute;top:-2px;right:2px}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
.hnav{border-top:1px solid var(--line)}
.hnav .wrap{display:flex;align-items:center;gap:6px}
.browse{position:relative}
.browse>button{border:0;background:var(--brand);color:var(--brand-ink);padding:10px 16px;font-weight:600;display:flex;gap:8px;align-items:center;border-radius:0}
.ci{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--t) 15%,transparent);color:var(--t);flex:none}
.catmenu{position:absolute;left:0;top:100%;width:270px;background:var(--surface);border:1px solid var(--line);border-radius:0 0 10px 10px;box-shadow:var(--shadow);padding:6px;z-index:30}
.catmenu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left}
.catmenu button:hover{background:var(--brand-soft);color:var(--brand)}
.catmenu .ci{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--t) 16%,transparent);color:var(--t);flex:none}
.hnav nav{display:flex;gap:2px}
.hnav nav a{padding:10px 14px;text-decoration:none;color:var(--ink);font-weight:500;border-bottom:2px solid transparent}
.hnav nav a.on,.hnav nav a:hover{color:var(--brand);border-bottom-color:var(--brand)}
.hnav .hot{margin-left:auto;font-size:14px;color:var(--muted)}
.hnav .hot b{color:var(--ink)}
@media (max-width:860px){
  .hnav,.hicons .hide-m,.topbar{display:none}
  .hmain{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .logo{flex:1}
}
/* hero slider */
.hero{position:relative;margin:18px 0;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.slide{display:grid;grid-template-columns:1.1fr .9fr;min-height:300px;background:linear-gradient(110deg,color-mix(in srgb,var(--t) 14%,var(--surface)) 0%,var(--surface) 70%)}
.slide .txt{padding:36px 40px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.slide .eyebrow{font-size:13px;font-weight:600;color:var(--t);letter-spacing:.02em}
.slide h1{font-size:clamp(26px,3.6vw,40px);letter-spacing:-.01em}
.slide p{margin:0;color:var(--muted);max-width:46ch}
.slide .art{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,128px);gap:12px;padding:22px;align-content:center}
.slide .art>*{border-radius:12px;aspect-ratio:1;width:100%;object-fit:cover}
.slide .art>*:first-child{grid-row:span 2;aspect-ratio:auto;height:100%}
.dots{position:absolute;left:40px;bottom:16px;display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:9px;border:0;background:var(--line);padding:0}
.dots button.on{width:24px;background:var(--brand)}
@media (max-width:760px){.slide{grid-template-columns:1fr;min-height:0}.slide .art{order:-1;padding:14px 14px 0;grid-template-columns:repeat(3,1fr)}.slide .art{grid-template-rows:auto}.slide .art>*:first-child{grid-row:auto;aspect-ratio:1}.slide .txt{padding:18px 20px 40px}.dots{left:20px}}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 8px}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.trust svg{color:var(--brand);flex:none}
.trust b{display:block;font-size:14.5px}
@media (max-width:760px){.trust{grid-template-columns:1fr 1fr}}
.sec{margin:28px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h h2{font-size:21px}
.sec-h button,.sec-h a{font-weight:600;font-size:14px;background:none;border:0;color:var(--brand);text-decoration:none}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-weight:600;font-size:14px}
.cat:hover{border-color:var(--brand);color:var(--brand)}
.cat .ci{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--t) 15%,transparent);color:var(--t)}
.cat span{font-size:12px;color:var(--muted);font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media (max-width:480px){.pgrid{grid-template-columns:1fr 1fr;gap:10px}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:box-shadow .15s}
.pcard:hover{box-shadow:var(--shadow)}
.pcard .pimg{display:block;position:relative;aspect-ratio:1;width:100%}
.pcard .pimg>.ph,.pcard .pimg>img{width:100%;height:100%;object-fit:cover}
.tags{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bad);color:#fff}
.tag.new{background:var(--brand);color:var(--brand-ink)}
.tag.combo{background:var(--accent)}
.tag.out{background:#333;color:#fff}
.wish{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#888;display:flex;align-items:center;justify-content:center}
.wish.on{color:var(--bad)}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcat{font-size:12px;color:var(--muted)}
.pname{text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px;line-height:1.35}
.pname:hover{color:var(--brand)}
.vhint{font-size:12px;color:var(--muted)}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price b{font-size:17px;color:var(--brand)}
.price s{color:var(--muted);font-size:13.5px}
.pact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;padding-top:8px}
.pact .btn{padding:7px 6px;font-size:13px}
@media (max-width:480px){.pact{grid-template-columns:1fr}}
/* placeholder product art */
.ph{position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--t) 10%,var(--surface)) 0,color-mix(in srgb,var(--t) 22%,var(--surface)) 100%);color:var(--t);overflow:hidden}
.ph svg{width:42%;height:42%;stroke-width:1.4;opacity:.9}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--t) 6%,transparent) 14px 15px)}
/* products page */
.crumb{font-size:13.5px;color:var(--muted);margin:16px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--brand)}
.shoplayout{display:grid;grid-template-columns:250px 1fr;gap:20px;margin:16px 0}
@media (max-width:860px){.shoplayout{grid-template-columns:1fr}}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;align-self:start;display:flex;flex-direction:column;gap:16px}
.filters h4{font-size:14px;margin-bottom:6px}
.opt{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14.5px;cursor:pointer}
.opt input{accent-color:var(--brand)}
@media (max-width:860px){.filters{gap:10px}.filters details:not([open]) .fbody{display:none}}
.filters summary{font-weight:600;cursor:pointer;list-style:none}
@media (min-width:861px){.filters summary{display:none}}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
/* product page */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:16px 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.pd .gallery>*{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover}
.pd .info{display:flex;flex-direction:column;gap:12px}
.pd h1{font-size:clamp(22px,2.6vw,28px)}
.pd .bigprice b{font-size:28px;color:var(--brand)}
.optgrp{display:flex;flex-direction:column;gap:6px}
.optgrp .lbl{font-size:14px;font-weight:600}
.optgrp .lbl span{font-weight:400;color:var(--muted)}
.ochips{display:flex;gap:8px;flex-wrap:wrap}
.ochip{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-weight:500}
.ochip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.ochip.na{opacity:.5;text-decoration:line-through}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface2);width:34px;height:36px;font-size:17px}
.qty span{min-width:40px;display:flex;align-items:center;justify-content:center;font-weight:600}
@media (max-width:760px){.pd{grid-template-columns:1fr;padding:14px;gap:16px}}
/* account, contact */
.narrow{max-width:720px;margin:20px auto}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
footer.shop{background:var(--surface);border-top:1px solid var(--line);margin-top:40px;padding:30px 0 90px;font-size:14px}
footer.shop .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:20px}
footer.shop h4{font-size:15px;margin-bottom:8px}
footer.shop ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
footer.shop a{color:var(--muted);text-decoration:none}
footer.shop a:hover{color:var(--brand)}
@media (max-width:760px){footer.shop .cols{grid-template-columns:1fr 1fr}}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a,.bottomnav button{border:0;background:none;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:11.5px;padding:7px 0 6px;gap:1px;position:relative}
.bottomnav .on{color:var(--brand)}
.bottomnav .badge{position:absolute;top:2px;right:calc(50% - 22px);height:16px;min-width:16px;font-size:10px}
@media (max-width:860px){.bottomnav{display:grid}}
.wa-fab{position:fixed;right:16px;bottom:20px;z-index:25;background:#1f9d55;color:#fff;border-radius:999px;padding:11px 16px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);text-decoration:none}
@media (max-width:860px){.wa-fab{bottom:72px;padding:11px}.wa-fab span{display:none}}
.journey{display:flex;justify-content:space-between;margin:16px 0 6px;position:relative}
.journey::before{content:"";position:absolute;left:12px;right:12px;top:11px;height:3px;background:var(--line)}
.jstep{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center;flex:1;position:relative;color:var(--muted)}
.jstep i{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:block}
.jstep.done{color:var(--ink)}
.jstep.done i{background:var(--brand);border-color:var(--brand)}
.jstep.bad i{background:var(--bad);border-color:var(--bad)}
/* overlay */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 20px);overflow:auto;box-shadow:var(--shadow)}
.modal.wide{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mh h3{font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mb{padding:18px;display:flex;flex-direction:column;gap:14px}
.drawer-scrim{justify-content:flex-end;padding:0;align-items:stretch}
.drawer{background:var(--surface);width:100%;max-width:480px;height:100%;overflow:auto;display:flex;flex-direction:column}
.citem{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.citem>.ph,.citem>img{width:60px;height:60px;border-radius:8px;object-fit:cover}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.sumrow.total{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.payopt{border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow)}
.morelist{display:flex;flex-direction:column}
.morelist a{padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}

.admin{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.aside{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
.aside .logo{font-size:20px;padding:4px 8px 12px}
.aside .grp{font-size:11.5px;color:var(--muted);letter-spacing:.05em;padding:12px 10px 4px;font-weight:600}
.aside a.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.aside a.nav:hover{background:var(--surface2)}
.aside a.nav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.aside a.nav .badge{margin-left:auto}
.aside .me{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.amain{min-width:0;display:flex;flex-direction:column}
.atop{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:15;flex-wrap:wrap}
.atop h1{font-size:20px;flex:1}
.acontent{padding:20px 22px 40px;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){
  .admin{grid-template-columns:1fr}
  .aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  .aside .logo,.aside .grp{display:none}
  .aside a.nav{white-space:nowrap;padding:7px 10px}
  .aside .me{margin:0;border:0;padding:0;flex-direction:row;align-items:end}
  .atop{padding:12px 16px}.acontent{padding:16px}
}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--brand))}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12.5px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}

@media (max-width:1100px){.panel,.panel.w8,.panel.w6{grid-column:span 6}}
@media (max-width:760px){.panel,.panel.w8,.panel.w6{grid-column:span 12}}
.panel h3{font-size:15.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .bar{fill:var(--brand);opacity:.82}
.chart .bar.hi{fill:var(--accent);opacity:1}
.hbar{display:grid;grid-template-columns:118px 1fr 52px;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.hbar .t{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;background:var(--c,var(--brand))}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:13.5px}

.leak{color:var(--bad);font-size:12.5px}

.sla .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

.insight{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.insight:last-child{border-bottom:0}

.insight.risk .dot{background:var(--bad)}
.insight.warn .dot{background:var(--warn)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}

table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--surface2)}
table.t tr.sel td{background:var(--brand-soft)}
table.t.mini td,table.t.mini th{padding:6px 8px;font-size:13.5px}
table.t .inp{padding:6px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.chip .c{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.bulkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:var(--r);padding:10px 12px}
.bulkbar select{width:auto}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none}
.thumb.ph svg{width:55%;height:55%}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 12px 16px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.timeline li b{display:block;font-size:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.notif{position:absolute;right:16px;top:58px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;max-height:420px;overflow:auto}
.notif .h{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.notif .it{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.notif .it.unread{background:var(--brand-soft)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;padding:26px}
.invoice{border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14px;break-inside:avoid}
.invoice+.invoice{margin-top:14px}
.invoice .ih{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.optrow{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center}
@media (max-width:560px){.optrow{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.modal,.modal *{visibility:visible}.modal{position:absolute;left:0;top:0;max-height:none;box-shadow:none}.noprint{display:none!important}}
@media (prefers-reduced-motion: no-preference){
  .modal,.drawer{animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}

/* ---------------- variants ---------------- */
function cartesian(opts){return opts.reduce((acc,o)=>acc.flatMap(a=>o.values.map(v=>[...a,v])),[[]])}
function buildVariants(options,prev=[],base={price:0,old:0,stock:0}){
  const clean=options.filter(o=>o.name&&o.values.length);
  if(!clean.length){const p=prev.find(v=>v.key==='')||prev[0]||base;return [{key:'',vals:[],price:+p.price||0,old:+p.old||0,stock:+p.stock||0,sku:p.sku||''}]}
  return cartesian(clean).map(vals=>{const key=vals.join(' / ');const p=prev.find(v=>v.key===key)||{...base};return {key,vals,price:+p.price||0,old:+p.old||0,stock:+p.stock||0,sku:p.sku||''}});
}
const variant=(p,key)=>p.variants.find(v=>v.key===key);
const minPrice=p=>Math.min(...p.variants.map(v=>v.price));
const maxPrice=p=>Math.max(...p.variants.map(v=>v.price));
const totalStock=p=>p.variants.reduce((s,v)=>s+v.stock,0);
const hasOpts=p=>p.options&&p.options.length>0;
function bestOld(p){const v=p.variants.find(v=>v.price===minPrice(p));return v&&v.old>v.price?v.old:0}
const pctOff=p=>{const o=bestOld(p);return o?Math.round((o-minPrice(p))/o*100):0};

function pimg(p,cls=''){
  if(!p)return `<span class="ph ${cls}" style="--t:#889">${sv(CAT_ICONS.tag)}</span>`;
  if(p.image)return `<img class="${cls}" src="${p.image}" alt="${esc(p.name)}" loading="lazy">`;

const catIcon=(c,w=20)=>`<span class="ci" style="--t:${c.tint}">${sv(CAT_ICONS[c.icon]||CAT_ICONS.tag,w)}</span>`;
function soldQty(pid){let n=0;for(const o of S.orders)if(!['cancelled','returned'].includes(o.status))for(const it of o.items)if(it.pid===pid)n+=it.qty;return n}
const pillSt=s=>`<span class="pill ${STATUS[s].c}">${STATUS[s].t}</span>`;
const deliveryFor=d=>d==='ঢাকা'?+S.settings.inside:+S.settings.outside;
function couponCalc(code,sub){
  if(!code)return {d:0};
  const c=S.coupons.find(x=>x.code.toUpperCase()===code.trim().toUpperCase());
  if(!c||!c.active)return {d:0,err:'এই কুপন কোড সঠিক নয় বা মেয়াদ শেষ'};
  if(sub<c.min)return {d:0,err:`এই কুপন ${tk(c.min)} বা তার বেশি অর্ডারে চলবে`};
  return {d:c.type==='percent'?Math.round(sub*c.value/100):Math.min(c.value,sub),c};
}
const normPhone=p=>String(p).replace(/[\s-]/g,'').replace(/^\+?88/,'');
const validPhone=p=>/^01[3-9]\d{8}$/.test(normPhone(p));

function adjustStock(items,sign){for(const it of items){const p=prod(it.pid);const v=p&&variant(p,it.vkey);if(v)v.stock=Math.max(0,v.stock+sign*it.qty)}}

function createOrder({name,phone,address,district,items,coupon,note,source,by,status}){
  const sub=items.reduce((s,x)=>s+x.price*x.qty,0),delivery=deliveryFor(district),cc=couponCalc(coupon,sub),now=Date.now();
  const o={id:'o'+now+Math.floor(Math.random()*999),inv:'INV-'+(S.nextInv++),name,phone:normPhone(phone),address,district,items,sub,delivery,discount:cc.d||0,coupon:cc.c?cc.c.code:'',
    total:sub+delivery-(cc.d||0),status:'pending',courier:'',tracking:'',createdAt:now,history:[{s:'pending',by:by||'কাস্টমার',at:now,note:source&&source!=='ওয়েবসাইট'?source+' থেকে অর্ডার':''}],note:note||'',source:source||'ওয়েবসাইট'};
  if(cc.c)cc.c.used=(cc.c.used||0)+1;
  adjustStock(items,-1);
  if(status&&status!=='pending'){o.status=status;o.history.push({s:status,by,at:now+1,note:''})}
  S.orders.unshift(o);save();return o;
}
function setStatus(o,s,note=''){
  if(o.status===s)return;const prev=o.status;
  if(s==='cancelled'&&!['cancelled','returned'].includes(prev))adjustStock(o.items,1);
  if(prev==='cancelled'&&s!=='cancelled')adjustStock(o.items,-1);
  o.status=s;if(s==='cancelled')o.cancelReason=note||o.cancelReason||'';
  o.history.push({s,by:meName(),at:Date.now(),note});
}
function sendToCourier(o,c){
  o.courier=c;o.tracking=COURIERS[c].p+Math.floor(10000000+Math.random()*89999999);
  if(['pending','confirmed','hold'].includes(o.status)){if(o.status!=='confirmed')o.history.push({s:'confirmed',by:meName(),at:Date.now(),note:''});o.status='ready';o.history.push({s:'ready',by:meName(),at:Date.now()+1,note:`${COURIERS[c].t}-এ পাঠানো হয়েছে (ডেমো)`})}
}

  const pr={u200:[0,199],'200-500':[200,500],'500-1000':[500,1000],'1000-2000':[1000,2000],o2000:[2000,1e9]}[shop.price];
  if(pr)ps=ps.filter(p=>minPrice(p)<=pr[1]&&maxPrice(p)>=pr[0]);
  if(shop.min!=='')ps=ps.filter(p=>maxPrice(p)>=+shop.min);
  if(shop.max!=='')ps=ps.filter(p=>minPrice(p)<=+shop.max);

  catmenu:()=>{catMenu=!catMenu;const b=document.querySelector('.browse');if(!b)return;const m=b.querySelector('.catmenu');if(m)m.remove();if(catMenu)b.insertAdjacentHTML('beforeend',`<div class="catmenu">${S.categories.map(c=>`<button data-act="gocat" data-id="${c.id}">${catIcon(c,17)}${esc(c.name)}</button>`).join('')}</div>`);b.firstElementChild.setAttribute('aria-expanded',catMenu)},
  gocat:t=>{shop.cat=t.dataset.id;shop.q='';shop.quick=[];shop.price='';shop.min='';shop.max='';closeModal();go('products')},
  quick:t=>{shop.quick=[t.dataset.id];shop.cat='';shop.q='';go('products')},
  sortpop:()=>{shop={...shop,quick:[],cat:'',q:'',sort:'pop'};go('products')},
  slide:t=>{showSlide(+t.dataset.id);startSlider()},
  fapply:()=>{shop.min=$('#fmin').value;shop.max=$('#fmax').value;shop.price='';renderShop('products')},
  freset:()=>{shop={...shop,q:'',cat:'',quick:[],price:'',min:'',max:''};renderShop('products')},
  trackinv:t=>{shop.trackQ=t.dataset.id;closeModal();go('track')},
  signout:()=>{S.user=null;save();renderShop('account')},
  logout:()=>{authed=false;try{sessionStorage.removeItem('sg_admin')}catch(e){}location.hash='home'},
  range:t=>{adm.range=t.dataset.id;adm.sel.clear();refreshAdmin()},
  notif:()=>{adm.notif=!adm.notif;refreshAdmin()},
  markread:()=>{S.lastSeen=Date.now();adm.notif=false;save();refreshAdmin()},
  ostatus:t=>{adm.status=t.dataset.id;adm.sel.clear();refreshAdmin()},
  gostatus:t=>{adm.status=t.dataset.id;adm.range='all';location.hash='admin-orders'},
  openOrder:t=>orderDrawer(t.dataset.id),
  custorders:t=>{adm.q=t.dataset.id;adm.status='all';adm.range='all';location.hash='admin-orders'},
  sel:(t,e)=>{const id=t.dataset.id;t.checked?adm.sel.add(id):adm.sel.delete(id);t.closest('tr').classList.toggle('sel',t.checked);renderBulk()},
  selall:t=>{const l=ordersFiltered();if(t.checked)l.forEach(o=>adm.sel.add(o.id));else adm.sel.clear();renderOrdersTable()},
  clearsel:()=>{adm.sel.clear();renderOrdersTable()},
  bulkSt:()=>{const s=$('#bulkSt').value;if(!s){toast('আগে একটা স্ট্যাটাস বাছুন');return}const n=adm.sel.size;adm.sel.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o)setStatus(o,s,s==='cancelled'?'একসাথে ক্যানসেল করা':'')});adm.sel.clear();save();toast(`${n}টি অর্ডার ${STATUS[s].t} করা হয়েছে`);refreshAdmin()},
  bulkC:()=>{const c=$('#bulkC').value;let n=0,skip=0;adm.sel.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o&&['pending','confirmed','hold','ready'].includes(o.status)&&!o.tracking){sendToCourier(o,c);n++}else skip++});adm.sel.clear();save();toast(`${n}টি অর্ডার ${COURIERS[c].t}-এ পাঠানো হয়েছে${skip?`, ${skip}টি বাদ (আগেই পাঠানো বা বন্ধ)`:''}`);refreshAdmin()},
  invoices:()=>showInvoices([...adm.sel]),inv1:t=>showInvoices([t.dataset.id]),
  print:()=>{try{window.print()}catch(e){toast('এই প্রিভিউতে প্রিন্ট বন্ধ, লাইভ সাইটে কাজ করবে')}},
  newOrder:()=>newOrderForm(),
  oact:t=>orderAction(t.dataset.id,t.dataset.s),
  copymsg:t=>{try{navigator.clipboard.writeText(t.dataset.msg).then(()=>toast('মেসেজ কপি হয়েছে'),()=>toast('কপি করা যায়নি'))}catch(e){toast('কপি করা যায়নি')}},
  addnote:t=>{const v=$('#noteIn').value.trim();if(!v)return;const o=S.orders.find(x=>x.id===t.dataset.id);o.history.push({s:'note',by:meName(),at:Date.now(),note:v});save();orderDrawer(o.id)},
  retst:t=>{const o=S.orders.find(x=>x.id===t.dataset.id);if(!o.ret)o.ret={type:'return',reason:'—',st:'requested',at:Date.now()};o.ret.st=t.dataset.s;o.history.push({s:'note',by:meName(),at:Date.now(),note:RET_ST[t.dataset.s]});save();toast(RET_ST[t.dataset.s]);refreshAdmin()},
  msgread:t=>{const m=S.messages.find(x=>x.id===t.dataset.id);if(m)m.read=true;save();refreshAdmin()},
  pedit:t=>productForm(t.dataset.id),
  pdel:t=>{const p=prod(t.dataset.id);askConfirm(`"${esc(p.name)}" মুছে ফেলবেন? আগের অর্ডারে নামটা থেকে যাবে।`,()=>{S.products=S.products.filter(x=>x!==p);S.cart=S.cart.filter(x=>x.pid!==p.id);S.wish=S.wish.filter(x=>x!==p.id);save();refreshAdmin();toast('প্রোডাক্ট মুছে ফেলা হয়েছে')},'মুছে ফেলুন')},
  csave:t=>{const c=S.categories.find(x=>x.id===t.dataset.id),v=$('#cn_'+c.id).value.trim();if(!v)return;c.name=v;c.icon=$('#ci_'+c.id).value;c.tint=$('#ct_'+c.id).value;save();refreshAdmin();toast('ক্যাটাগরি সেভ হয়েছে')},
  cdel:t=>{const id=t.dataset.id;if(S.products.some(p=>p.cat===id)){toast('এই ক্যাটাগরিতে প্রোডাক্ট আছে, আগে সেগুলো সরান');return}S.categories=S.categories.filter(c=>c.id!==id);save();refreshAdmin()},
  ctog:t=>{const c=S.coupons[+t.dataset.id];c.active=!c.active;save();refreshAdmin()},
  cpdel:t=>{S.coupons.splice(+t.dataset.id,1);save();refreshAdmin()},
  logorm:()=>{S.settings.logo='';save();refreshAdmin()},
  reset:()=>askConfirm('সব ডেমো ডেটা (অর্ডার, প্রোডাক্ট, সেটিংস) শুরুর অবস্থায় ফিরে যাবে। নিশ্চিত?',()=>{S=seed();save();toast('ডেমো ডেটা রিসেট হয়েছে');refreshAdmin()},'রিসেট করুন')
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(adm.notif&&!e.target.closest('.notif')&&!(t&&t.dataset.act==='notif')){adm.notif=false;const n=$('.notif');if(n)n.remove()}
  if(catMenu&&!e.target.closest('.browse')){catMenu=false;const m=$('.catmenu');if(m)m.remove()}
  if(!t)return;
  if(t.dataset.act==='scrim'){if(e.target===t)closeModal();return}
  const f=A[t.dataset.act];
  if(t.tagName==='A'){if(t.dataset.act==='close')closeModal();else if(f)f(t,e);return}
  if(!f)return;
  if(t.tagName!=='INPUT')e.preventDefault();
  f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.ch;if(!k)return;
  if(k==='fcat'){shop.cat=t.value;renderShop('products')}
  else if(k==='fquick'){shop.quick=[...document.querySelectorAll('[data-ch="fquick"]:checked')].map(x=>x.value);renderShop('products')}
  else if(k==='fprice'){shop.price=t.value;shop.min='';shop.max='';renderShop('products')}
  else if(k==='fsort'){shop.sort=t.value;renderProductGrid()}
  else if(k==='ocourier'){adm.courier=t.value;adm.sel.clear();refreshAdmin()}
  else if(k==='pcat'){adm.pcat=t.value;renderProductsTable()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML)closeModal()});
route();
</script>
</body>
</html>
