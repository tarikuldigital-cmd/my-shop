name: Export shop catalogue
on:
  workflow_dispatch:
  push:
    paths: ['tools/wc-export.mjs', '.github/workflows/catalogue-export.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/wc-export.mjs https://shop.varieytbazar.com data/varieytbazar
      - run: |
          git config user.name "catalogue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/varieytbazar
          git commit -m "Catalogue export: shop.varieytbazar.com" || echo "nothing to commit"
          git pull --rebase origin main && git push
