<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart China Gallery | অনলাইন শপ</title>
<meta name="description" content="দরকারি সব প্রোডাক্ট এক জায়গায়। সারা বাংলাদেশে হোম ডেলিভারি ও ক্যাশ অন ডেলিভারি।">
<meta property="og:title" content="Smart China Gallery">
<meta property="og:description" content="গ্যাজেট, ফ্যাশন, ঘর ও কিচেন, বিউটি আর আরও অনেক কিছু। সারা দেশে ক্যাশ অন ডেলিভারি।">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b6b52">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='scgG' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a00'/%3E%3Cstop offset='.55' stop-color='%23f85606'/%3E%3Cstop offset='1' stop-color='%23e8301c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='13' fill='url%28%23scgG%29'/%3E%3Cpath d='M18.5 18v-2.2a5.5 5.5 0 0 1 11 0V18' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round'/%3E%3Cpath d='M12.6 18.2h22.8l-1.7 17.1a3.2 3.2 0 0 1-3.2 2.9H17.5a3.2 3.2 0 0 1-3.2-2.9z' fill='%23fff'/%3E%3Cpath d='M24 22.2l1.7 4.3 4.3 1.7-4.3 1.7-1.7 4.3-1.7-4.3-4.3-1.7 4.3-1.7z' fill='%23f85606'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: international marketplace — utility bar, search-first header, category rail, dense image-led grid; operations-style admin with left rail */
:root{
  --brand-base:#f85606;
  --bg:#f4f4f6; --surface:#ffffff; --surface2:#f6f6f8; --ink:#212121; --muted:#6b7280; --line:#e8e8ec;
  --brand:var(--brand-base); --brand-ink:#ffffff; --brand-soft:color-mix(in srgb,var(--brand) 10%,var(--surface)); --accent:#e11d48;
  --good:#1d7a3e; --warn:#a86300; --bad:#c92a2a; --info:#1f5fa8; --hold:#7a4fb0; --star:#f59f00;
  --font-body:'Manrope','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(16,24,32,.04),0 8px 24px rgba(16,24,32,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1113; --surface:#161a1d; --surface2:#1f2428; --ink:#e8ecef; --muted:#9aa5ad; --line:#2a3035;
    --brand:color-mix(in srgb,var(--brand-base) 62%,#ffffff); --brand-ink:#0b1210; --accent:#ff8a3d;
    --good:#5cc382; --warn:#e0a640; --bad:#ff6b6b; --info:#74aaf0; --hold:#b592e6;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1113; --surface:#161a1d; --surface2:#1f2428; --ink:#e8ecef; --muted:#9aa5ad; --line:#2a3035;
  --brand:color-mix(in srgb,var(--brand-base) 62%,#ffffff); --brand-ink:#0b1210; --accent:#ff8a3d;
  --good:#5cc382; --warn:#e0a640; --bad:#ff6b6b; --info:#74aaf0; --hold:#b592e6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
@media (max-width:560px){.wrap{padding:0 14px}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hide{display:none!important}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:10px 18px;border-radius:10px;font-weight:700;white-space:nowrap;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.plain{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn.lg{padding:13px 22px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.iconbtn{border:0;background:transparent;padding:7px;border-radius:9px;display:inline-flex;align-items:center;gap:5px;color:inherit;text-decoration:none}
.iconbtn:hover{background:var(--surface2)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;min-height:76px}
.err{color:var(--bad);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.pill.info2{color:var(--brand);background:color-mix(in srgb,var(--brand) 13%,transparent)}
.pill.transit{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pill.hold{color:var(--hold);background:color-mix(in srgb,var(--hold) 13%,transparent)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pill.bad2{color:var(--bad);background:transparent;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.empty{padding:44px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.demo-note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:9px 11px}
.stars{display:inline-flex;gap:1px;color:var(--star);vertical-align:middle}
.stars .off{color:var(--line)}

/* ===== storefront ===== */
.utilbar{background:color-mix(in srgb,var(--brand) 9%,var(--surface));color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.utilbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px;flex-wrap:wrap}
.utilbar a,.utilbar button{color:inherit;text-decoration:none;border:0;background:none;padding:4px 8px;border-radius:6px;font-size:13px}
.utilbar a:hover,.utilbar button:hover{color:var(--brand);background:var(--surface)}
.utilbar .r{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.langsw{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:7px;overflow:hidden;margin-left:4px}
.langsw button{padding:3px 9px;border-radius:0}
.langsw button.on{background:var(--brand);color:var(--brand-ink)}
.langsw button.on:hover{background:var(--brand);color:var(--brand-ink)}
header.shop{background:var(--surface);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(0,0,0,.04)}
.hmain{display:flex;align-items:center;gap:22px;padding-top:14px;padding-bottom:14px}
.logo{font-size:22px;font-weight:800;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap;letter-spacing:-.02em}
.logo .mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.logo img{height:40px;width:auto}
.lmark{display:flex;flex:none;filter:drop-shadow(0 3px 6px rgba(248,86,6,.28))}
.lword{display:flex;flex-direction:column;line-height:1}
.lword b{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.lword i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.38em;color:var(--brand);margin-top:4px;text-transform:uppercase}
.searchbox{flex:1;position:relative;max-width:680px}
.search{display:flex;border:1.5px solid var(--brand);border-radius:12px;overflow:hidden;background:var(--surface)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:var(--surface)}
.search input{border:0;background:transparent;padding:11px 16px;flex:1;min-width:0}
.search input:focus{outline:none}
.search button{border:0;background:var(--brand);color:var(--brand-ink);padding:0 20px;font-weight:700;display:flex;align-items:center;gap:6px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;overflow:hidden}
.suggest a{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 12px;text-decoration:none;color:var(--ink)}
.suggest a:hover,.suggest a.on{background:var(--surface2)}
.suggest a>.ph,.suggest a>img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.suggest .all{display:block;text-align:center;padding:10px;font-weight:600;color:var(--brand);border-top:1px solid var(--line)}
.hicons{display:flex;gap:2px;align-items:center}
.hicon{position:relative;display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:600;color:var(--ink);text-decoration:none;border:0;background:none;padding:5px 9px;border-radius:10px;gap:1px}
.hicon:hover{background:var(--surface2)}
.hicon .badge{position:absolute;top:0;right:4px}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-weight:800}
.catrail{border-top:1px solid var(--line)}
.catrail .wrap{display:flex;align-items:center;gap:4px}
.browse{position:relative;flex:none}
.browse>button{border:0;background:var(--brand-soft);color:var(--brand);padding:8px 14px;font-weight:700;display:flex;gap:8px;align-items:center;border-radius:9px;margin:6px 6px 6px 0}
.catmenu{position:absolute;left:0;top:100%;width:290px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30}
.catmenu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left}
.catmenu button:hover{background:var(--brand-soft);color:var(--brand)}
.ci{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--t) 15%,transparent);color:var(--t);flex:none}
.railnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.railnav::-webkit-scrollbar{display:none}
.railnav a,.railnav button{white-space:nowrap;padding:12px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;border:0;background:none;border-bottom:2px solid transparent}
.railnav a.on,.railnav a:hover,.railnav button:hover{color:var(--brand);border-bottom-color:var(--brand)}
.railnav .flash{color:var(--accent)}
@media (max-width:860px){
  .utilbar .hide-m,.hicons .hide-m,.browse{display:none}
  .hmain{flex-wrap:wrap;gap:10px;padding-top:10px;padding-bottom:10px}
  .searchbox{order:3;flex-basis:100%;max-width:none}
  .logo{flex:1;font-size:19px}
  .search button span{display:none}
}
/* hero */
.hero{position:relative;margin:18px 0;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.slide{display:grid;grid-template-columns:1.1fr .9fr;min-height:320px;background:linear-gradient(110deg,color-mix(in srgb,var(--t) 16%,var(--surface)) 0%,var(--surface) 72%)}
.slide .txt{padding:40px 44px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.slide .eyebrow{font-size:12.5px;font-weight:700;color:var(--t);letter-spacing:.08em;text-transform:uppercase}
.slide h1{font-size:clamp(26px,3.8vw,44px);font-weight:800;letter-spacing:-.025em}
.slide p{margin:0;color:var(--muted);max-width:46ch;font-size:16px}
.slide .art{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,132px);gap:12px;padding:22px;align-content:center}
.slide .art>*{border-radius:14px;width:100%;height:100%;object-fit:cover}
.slide .art>*:first-child{grid-row:span 2}
.dots{position:absolute;left:44px;bottom:18px;display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:9px;border:0;background:var(--line);padding:0}
.dots button.on{width:26px;background:var(--brand)}
@media (max-width:760px){.slide{grid-template-columns:1fr;min-height:0}.slide .art{order:-1;padding:12px 12px 0;grid-template-columns:repeat(3,1fr);grid-template-rows:auto}.slide .art>*{aspect-ratio:1}.slide .art>*:first-child{grid-row:auto}.slide .txt{padding:18px 20px 42px}.dots{left:20px}}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:13px;display:flex;gap:12px;align-items:center}
.trust svg{color:var(--brand);flex:none}
.trust b{display:block;font-size:14.5px}
@media (max-width:760px){.trust{grid-template-columns:1fr 1fr}.trust div{padding:10px 12px}}
.sec{margin:34px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px;gap:10px}
.sec-h h2{font-size:22px;font-weight:800}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sec-h button,.sec-h a{font-weight:700;font-size:14px;background:none;border:0;color:var(--brand);text-decoration:none;white-space:nowrap}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 8px;display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center;font-weight:700;font-size:13.5px;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-2px)}
.cat .ci{width:58px;height:58px;border-radius:50%}
.cat span{font-size:12px;color:var(--muted);font-weight:500}
/* flash sale */
.flashbar{background:linear-gradient(100deg,#ff7a1a,var(--brand) 55%,var(--accent));color:#fff;border-radius:16px;padding:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.flashbar h2{font-size:22px;font-weight:800;color:#fff}
.flashbar p{margin:0;opacity:.9;font-size:14px}
.countdown{display:flex;gap:6px;margin-left:auto}
.countdown span{background:rgba(0,0,0,.22);border-radius:9px;padding:6px 10px;text-align:center;min-width:52px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.countdown small{display:block;font-size:10.5px;font-weight:600;opacity:.85}
.promo{border-radius:16px;padding:24px 28px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(100deg,color-mix(in srgb,var(--brand) 14%,var(--surface)),color-mix(in srgb,#ffd43b 22%,var(--surface)));color:var(--ink);border:1px solid color-mix(in srgb,var(--brand) 22%,var(--line))}
.promo h3{font-size:22px;font-weight:800}
.promo p{margin:2px 0 0;opacity:.8}
/* product grid & card */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media (max-width:520px){.pgrid{grid-template-columns:1fr 1fr;gap:10px}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:box-shadow .2s,transform .2s}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.pcard .pimg{display:block;position:relative;aspect-ratio:1;width:100%;overflow:hidden;background:var(--surface2)}
.ph.broken{opacity:.9}
.pcard .pimg>.ph,.pcard .pimg>img{width:100%;height:100%;object-fit:cover;transition:opacity .3s,transform .4s}
.pcard .pimg>img.alt{position:absolute;inset:0;opacity:0}
.pcard:hover .pimg>img.alt{opacity:1}
.pcard:hover .pimg>img:first-child{transform:scale(1.03)}
.tags{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;z-index:2}
.tag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--bad);color:#fff;letter-spacing:.01em}
.tag.new{background:var(--brand);color:var(--brand-ink)}
.tag.combo{background:var(--hold)}
.tag.flash{background:var(--accent)}
.tag.out{background:#343a40;color:#fff}
.cardtools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.cardtools button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#555;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cardtools button:hover{color:var(--brand)}
.cardtools .wish.on{color:var(--bad)}
.cardtools .qv{opacity:0;transform:translateX(6px);transition:.2s}
.pcard:hover .cardtools .qv,.cardtools .qv:focus-visible{opacity:1;transform:none}
@media (hover:none){.cardtools .qv{opacity:1;transform:none}}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcat{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.pname{text-decoration:none;color:var(--ink);font-weight:700;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pname:hover{color:var(--brand)}
.rate{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price b{font-size:17px;color:var(--ink);font-weight:800}
.price s{color:var(--muted);font-size:13.5px}
.price .off{color:var(--bad);font-size:12.5px;font-weight:700}
.pact{margin-top:auto;padding-top:8px}
.pact .btn{width:100%;padding:9px 8px;font-size:13.5px}
.ph{position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--t) 9%,var(--surface)) 0,color-mix(in srgb,var(--t) 22%,var(--surface)) 100%);color:var(--t);overflow:hidden}
.ph svg{width:40%;height:40%;stroke-width:1.3;opacity:.9}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--t) 6%,transparent) 14px 15px)}
/* listing */
.crumb{font-size:13px;color:var(--muted);margin:18px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--brand)}
.shoplayout{display:grid;grid-template-columns:260px 1fr;gap:24px;margin:16px 0}
@media (max-width:860px){.shoplayout{grid-template-columns:1fr}}

<script>
"use strict";
/* =========================================================
   ডেটা লেয়ার
   এখন সব ডেটা ব্রাউজারের localStorage-এ থাকে।
   আসল অনলাইন অর্ডার নিতে শুধু এই DB অবজেক্টটা Firebase/Supabase দিয়ে বদলাতে হবে।
   ========================================================= */
const DB={
  key:'scg_store_v4',
  load(){try{const r=localStorage.getItem(this.key);if(r){const d=JSON.parse(r);if(d&&d.v===4){if(!d.enDefault){d.prefs=d.prefs||{};d.prefs.lang='en';d.enDefault=1}if(d.settings&&/Chaina/.test(d.settings.name||''))d.settings.name=d.settings.name.replace('Chaina','China');return d}}}catch(e){}return null},
  save(state){try{localStorage.setItem(this.key,JSON.stringify(state));return true}catch(e){return false}}
};

/* ---------------- utilities ---------------- */

function cartesian(opts){return opts.reduce((acc,o)=>acc.flatMap(a=>o.values.map(v=>[...a,v])),[[]])}
function buildVariants(options,prev=[],base={price:0,old:0,stock:0}){
  const clean=options.filter(o=>o.name&&o.values.length);
  if(!clean.length){const p=prev.find(v=>v.key==='')||prev[0]||base;return [{key:'',vals:[],price:+p.price||0,old:+p.old||0,cost:+p.cost||0,stock:+p.stock||0,sku:p.sku||''}]}
  return cartesian(clean).map(vals=>{const key=vals.join(' / ');const p=prev.find(v=>v.key===key)||{...base};return {key,vals,price:+p.price||0,old:+p.old||0,cost:+p.cost||0,stock:+p.stock||0,sku:p.sku||''}});
}
const variant=(p,key)=>p.variants.find(v=>v.key===key);
const minPrice=p=>Math.min(...p.variants.map(v=>v.price));
const maxPrice=p=>Math.max(...p.variants.map(v=>v.price));
const totalStock=p=>p.variants.reduce((s,v)=>s+v.stock,0);
const hasOpts=p=>p.options&&p.options.length>0;
function bestOld(p){const v=p.variants.find(v=>v.price===minPrice(p));return v&&v.old>v.price?v.old:0}
const pctOff=p=>{const o=bestOld(p);return o?Math.round((o-minPrice(p))/o*100):0};

  const nm=['সাবিনা ইয়াসমিন','রাশেদ খান','মিতু আক্তার','জুবায়ের হোসেন','নাজমা বেগম','তাসলিমা নাসরিন','ফয়সাল আহমেদ','রুবিনা খাতুন','সজীব হাসান'];
  const st=['new','new','new','new','contacted','contacted','converted','converted','dropped'];
  return st.map((status,i)=>{const p=pick(products),v=pick(p.variants),qty=rnd()<.8?1:2;const hasAddr=rnd()<.6;const d=rnd()<.5?'ঢাকা':pick(['চট্টগ্রাম','সিলেট','খুলনা','রাজশাহী','গাজীপুর']);
    const at=now-(i*7+rnd()*6)*HOUR;
    return {id:'d'+i,name:rnd()<.85?nm[i]:'',phone:'01'+pick(['3','7','8','9','5','6'])+String(Math.floor(rnd()*1e8)).padStart(8,'0'),address:hasAddr?'বাড়ি '+(10+i)+', রোড '+(2+i):'',district:hasAddr?d:'',
      items:[{pid:p.id,vkey:v.key,name:p.name,price:v.price,cost:v.cost,qty}],sub:v.price*qty,at,updated:at+4*6e4,status,
      log:status==='new'?[]:[{t:status==='dropped'?'বাদ দেওয়া হয়েছে':status==='converted'?'অর্ডারে রূপান্তর':'ফোন করা হয়েছে',by:'রিয়া',at:at+2*HOUR}],orderInv:status==='converted'?'INV-'+(30090-i):''}});
}

function pimg(p,cls='',i=0){
  if(!p)return `<span class="ph ${cls}" style="--t:#889">${sv(CAT_ICONS.tag)}</span>`;
  const im=(p.images||[])[i];

}
function imgFail(el){if(el.classList.contains('alt')){el.remove();return}const s=document.createElement('span');s.className='ph broken '+el.className;s.style.setProperty('--t',el.dataset.t||'#889');s.setAttribute('role','img');s.setAttribute('aria-label',el.alt||'');s.innerHTML=sv(CAT_ICONS[el.dataset.ic]||CAT_ICONS.tag);el.replaceWith(s)}

const deliveryFor=(d,sub=0)=>freeShip(sub)?0:(d==='ঢাকা'?+S.settings.inside:+S.settings.outside);
function couponCalc(code,sub){
  if(!code)return {d:0};
  const c=S.coupons.find(x=>x.code.toUpperCase()===code.trim().toUpperCase());
  if(!c||!c.active)return {d:0,err:'bad'};
  if(sub<c.min)return {d:0,err:'min',min:c.min};
  return {d:c.type==='percent'?Math.round(sub*c.value/100):Math.min(c.value,sub),c};
}

function createOrder({name,phone,address,district,items,coupon,note,source,by,status,payment}){
  const sub=items.reduce((s,x)=>s+x.price*x.qty,0),delivery=deliveryFor(district,sub),cc=couponCalc(coupon,sub),now=Date.now();
  items.forEach(it=>{if(it.cost===undefined){const v=prod(it.pid)&&variant(prod(it.pid),it.vkey);it.cost=v?v.cost||0:0}});
  const o={id:'o'+now+Math.floor(Math.random()*999),inv:'INV-'+(S.nextInv++),name,phone:normPhone(phone),address,district,items,sub,delivery,discount:cc.d||0,coupon:cc.c?cc.c.code:'',
    total:sub+delivery-(cc.d||0),status:'pending',courier:'',tracking:'',createdAt:now,history:[{s:'pending',by:by||'কাস্টমার',at:now,note:source&&source!=='ওয়েবসাইট'?source+' থেকে অর্ডার':''}],note:note||'',source:source||'ওয়েবসাইট',
    payment:payment||{method:'cod',status:'unpaid'}};
  if(cc.c)cc.c.used=(cc.c.used||0)+1;
  adjustStock(items,-1);
  if(status&&status!=='pending'){o.status=status;o.history.push({s:status,by,at:now+1,note:''})}
  S.orders.unshift(o);save();return o;
}
function setStatus(o,s,note=''){
  if(o.status===s)return;const prev=o.status;
  if(s==='cancelled'&&!['cancelled','returned'].includes(prev))adjustStock(o.items,1);
  if(prev==='cancelled'&&s!=='cancelled')adjustStock(o.items,-1);
  o.status=s;if(s==='cancelled')o.cancelReason=note||o.cancelReason||'';
  if(s==='delivered'&&o.payment&&o.payment.method==='cod')o.payment.status='paid';
  o.history.push({s,by:meName(),at:Date.now(),note});
}
function sendToCourier(o,c){
  o.courier=c;o.tracking=COURIERS[c].p+Math.floor(10000000+Math.random()*89999999);
  if(['pending','confirmed','hold'].includes(o.status)){if(o.status!=='confirmed')o.history.push({s:'confirmed',by:meName(),at:Date.now(),note:''});o.status='ready';o.history.push({s:'ready',by:meName(),at:Date.now()+1,note:`${COURIERS[c].t}-এ পাঠানো হয়েছে (ডেমো)`})}
}

function starsHtml(v,w=14){let h='';for(let i=1;i<=5;i++){const on=v>=i-.25;h+=`<svg width="${w}" height="${w}" viewBox="0 0 24 24" class="${on?'':'off'}" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`}return `<span class="stars" role="img" aria-label="${v.toFixed(1)} / 5">${h}</span>`}

/* ---------------- overlay ---------------- */
function openModal(title,body,{wide=false,drawer=false}={}){
  const al=esc(String(title).replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&'));
  const head=`<div class="mh"><h3>${title}</h3><button class="iconbtn noprint" data-act="close" aria-label="Close">${ICON.x}</button></div><div class="mb">${body}</div>`;
  $('#overlay').innerHTML=drawer?`<div class="scrim drawer-scrim" data-act="scrim"><div class="drawer" role="dialog" aria-modal="true" aria-label="${al}">${head}</div></div>`
    :`<div class="scrim" data-act="scrim"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${al}">${head}</div></div>`;
  document.body.style.overflow='hidden';
}
function closeModal(){$('#overlay').innerHTML='';document.body.style.overflow=''}
function askConfirm(msg,onYes,yesText='হ্যাঁ, করুন'){
  openModal('নিশ্চিত করুন',`<p style="margin:0">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn plain" data-act="close">না</button><button class="btn danger" id="cfYes">${yesText}</button></div>`);
  $('#cfYes').onclick=()=>{closeModal();onYes()};
}

  return `<div class="gallery"><div class="gmain" id="${ctx}Main">${pimg(p,'',Math.min(b.img,n-1))}<span class="tags">${inFlash(p)?`<span class="tag flash">⚡ ${t('tagFlash')}</span>`:''}${pctOff(p)?`<span class="tag">-${pctOff(p)}%</span>`:''}</span></div>
  ${n>1?`<div class="gthumbs">${p.images.map((im,i)=>`<button class="${i===b.img?'on':''}" data-act="gimg" data-ctx="${ctx}" data-i="${i}" aria-label="Image ${i+1}"><img src="${im}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"></button>`).join('')}</div>`:''}</div>`;
}
function buyBox(ctx,p){
  const b=BX[ctx];
  return `<div class="bigprice price num" id="${ctx}Price"></div><div id="${ctx}Stock"></div>
    ${(p.options||[]).map((o,i)=>`<div class="optgrp"><div class="lbl">${esc(o.name)}: <span id="${ctx}Lbl${i}">${esc(b.sel[i]||t('select'))}</span></div><div class="ochips">${o.values.map(v=>`<button class="ochip" data-act="opt" data-ctx="${ctx}" data-o="${i}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('')}
    <div class="row"><span class="small muted">${t('qty')}</span><div class="qty"><button type="button" data-act="bq" data-ctx="${ctx}" data-d="-1" aria-label="-">−</button><span id="${ctx}Q" class="num">${b.qty}</span><button type="button" data-act="bq" data-ctx="${ctx}" data-d="1" aria-label="+">+</button></div></div>
    <div class="grid2"><button class="btn ghost lg" data-act="badd" data-ctx="${ctx}" id="${ctx}AddB">${ICON.cart}${t('addCart')}</button><button class="btn accent lg" data-act="bbuy" data-ctx="${ctx}" id="${ctx}BuyB">${t('buyNow')}</button></div>`;
}
function updateBox(ctx){
  const b=BX[ctx],p=prod(b.pid);if(!p)return;const key=selKeyC(ctx),v=key===null?null:variant(p,key);
  (p.options||[]).forEach((o,i)=>{document.querySelectorAll(`[data-act="opt"][data-ctx="${ctx}"][data-o="${i}"]`).forEach(btn=>{
    btn.classList.toggle('on',b.sel[i]===btn.dataset.v);
    const test={...b.sel,[i]:btn.dataset.v};const complete=p.options.every((_,k)=>test[k]);
    const vv=complete?variant(p,p.options.map((_,k)=>test[k]).join(' / ')):null;
    btn.classList.toggle('na',!!(vv&&vv.stock<=0));btn.setAttribute('aria-pressed',b.sel[i]===btn.dataset.v)});
    const l=$('#'+ctx+'Lbl'+i);if(l)l.textContent=b.sel[i]||t('select')});
  const pe=$('#'+ctx+'Price'),se=$('#'+ctx+'Stock');if(!pe)return;
  let ph;
  if(v){ph=`<b>${tk(v.price)}</b>${v.old>v.price?`<s>${tk(v.old)}</s><span class="off">-${Math.round((v.old-v.price)/v.old*100)}%</span>`:''}`;
    se.innerHTML=(v.stock>0?(v.stock<=5?`<span class="pill warn">${t('onlyLeft',v.stock)}</span>`:`<span class="pill good">${t('inStock')}</span>`):`<span class="pill bad">${t('outOpt')}</span>`)+(v.sku?` <span class="small muted">${t('sku')}: ${esc(v.sku)}</span>`:'');}
  else{ph=priceHtml(p);se.innerHTML=`<span class="small muted">${t('pickOpt')}</span>`}
  pe.innerHTML=ph;const sb=$('#sbPrice');if(sb&&ctx==='pd')sb.innerHTML=ph;
  const ok=!!(v&&v.stock>0);['AddB','BuyB'].forEach(k=>{const el=$('#'+ctx+k);if(el)el.disabled=!ok&&key!==null});const sbb=$('#sbBuy');if(sbb&&ctx==='pd')sbb.disabled=!ok&&key!==null;
}

function orderCards(list){
  const rank={pending:0,hold:0,confirmed:1,ready:2,transit:3,delivered:4,returned:3,cancelled:-1};
  return list.map(o=>{const r=rank[o.status];
    return `<div class="card"><div class="row" style="justify-content:space-between"><b class="num">${o.inv}</b>${pillStL(o.status)}</div>
    <div class="muted small">${fdate(o.createdAt)} · ${t('total')} ${tk(o.total)} · ${o.payment?(o.payment.method==='cod'?t('cod'):PAY[o.payment.method]):''}</div><div class="small" style="margin-top:4px">${o.items.map(i=>itemLabel(i)+' ×'+i.qty).join('<br>')}</div>
    ${o.status==='cancelled'?`<p class="err" style="margin:10px 0 0">${t('cancelledMsg')}</p>`:`<div class="journey">${[0,1,2,3,4].map(i=>`<div class="jstep ${i<=r?'done':''} ${o.status==='returned'&&i===3?'bad':''}"><i></i>${t('j'+i)}</div>`).join('')}</div>`}
    ${o.tracking?`<div class="small" style="margin-top:8px">${t('courier')}: <b>${COURIERS[o.courier].t}</b> · ${t('trackingId')}: <b class="num">${o.tracking}</b></div>`:''}</div>`}).join('');
}
function renderTrackResult(){
  const q=shop.trackQ.trim(),el=$('#trackResult');if(!el)return;if(!q){el.innerHTML='';return}
  const list=S.orders.filter(o=>o.inv.toUpperCase()===q.toUpperCase()||o.phone===normPhone(q)).slice(0,5);
  el.innerHTML=list.length?orderCards(list):`<div class="empty">${t('trackNone')}</div>`;
}

function renderShop(view,arg){
  applyTheme();
  $('#app').innerHTML=shopShell(view);
  const m=$('#shopMain'),s=S.settings;
  m.innerHTML=view==='product'?viewProduct(arg):['about','privacy','terms','refund'].includes(view)?viewPage(view):{home:viewHome,products:viewProducts,wishlist:viewWishlist,track:viewTrack,account:viewAccount,contact:viewContact,thankyou:viewThanks}[view]();
  document.body.classList.toggle('has-sticky',view==='product');
  if(view==='products'){renderProductGrid();if(innerWidth<=860){const d=$('#fdet');if(d)d.open=false}}
  if(view==='track')renderTrackResult();
  if(view==='home')startSlider();else clearInterval(slideTimer);
  tickCountdowns();
  // SEO
  if(view==='product'){const p=prod(arg);if(p){updateBox('pd');const r=ratingOf(p.id);
    setSEO(`${pn(p)} | ${s.name}`,pdsc(p),{'@context':'https://schema.org','@type':'Product',name:pn(p),description:pdsc(p),sku:p.variants[0].sku,category:cn(p.cat),brand:{'@type':'Brand',name:s.name},
      offers:{'@type':'AggregateOffer',priceCurrency:'BDT',lowPrice:minPrice(p),highPrice:maxPrice(p),availability:totalStock(p)>0?'https://schema.org/InStock':'https://schema.org/OutOfStock'},
      ...(r.n?{aggregateRating:{'@type':'AggregateRating',ratingValue:r.avg.toFixed(1),reviewCount:r.n}}:{})});track('ViewContent',{value:minPrice(p),ids:[p.id]})}}
  else setSEO(view==='home'?`${s.name} | ${L(s,'tagline')}`:`${{products:shop.cat?cn(shop.cat):t('allProducts'),track:t('trackT'),account:t('account'),contact:t('contactT'),wishlist:t('wishlist'),thankyou:t('thanksT','').replace(/,.*/,''),about:t('about'),privacy:t('privacy'),terms:t('terms'),refund:t('refund')}[view]||''} | ${s.name}`,L(s,'tagline'),view==='home'?{'@context':'https://schema.org','@type':'Store',name:s.name,telephone:s.phone,address:L(s,'address'),url:location.href.split('#')[0]}:null);
  updateCartBadges();
  bindShopForms();
}
function bindShopForms(){
  const si=$('#searchInput');
  $('#searchForm').onsubmit=e=>{e.preventDefault();shop.q=si.value;shop.cat='';track('Search',{q:shop.q});$('#suggest').innerHTML='';go('products')};
  si.oninput=()=>{shop.q=si.value;renderSuggest();if(curView==='products')renderProductGrid()};
  si.onfocus=renderSuggest;
  const tf=$('#trackForm');if(tf)tf.onsubmit=e=>{e.preventDefault();shop.trackQ=$('#trackInput').value;renderTrackResult()};
  const af=$('#accForm');if(af)af.onsubmit=e=>{e.preventDefault();const n=$('#accName').value.trim(),ph=$('#accPhone').value;if(!n||!validPhone(ph)){$('#accErr').textContent=t('signInErr');return}S.user={name:n,phone:normPhone(ph)};save();renderShop('account');toast(t('signedIn'))};
  const cf=$('#ctForm');if(cf)cf.onsubmit=e=>{e.preventDefault();const n=$('#ctName').value.trim(),ph=$('#ctPhone').value.trim(),msg=$('#ctMsg').value.trim();if(!n||!msg){$('#ctErr').textContent=t('msgErr');return}S.messages.unshift({id:'m'+Date.now(),name:n,phone:ph,msg,at:Date.now(),read:false});save();cf.reset();$('#ctErr').innerHTML=`<span style="color:var(--good)">${t('msgOk')}</span>`};
  const nf=$('#newsForm');if(nf)nf.onsubmit=e=>{e.preventDefault();const ph=$('#newsPhone').value;if(!validPhone(ph)){toast(t('ePhone'));return}S.subscribers=S.subscribers||[];if(!S.subscribers.find(x=>x.phone===normPhone(ph)))S.subscribers.push({phone:normPhone(ph),at:Date.now()});save();nf.reset();toast(t('subOk'))};
  const rf=$('#revForm');if(rf)rf.onsubmit=e=>{e.preventDefault();const n=$('#rvName').value.trim(),tx=$('#rvText').value.trim(),pid=curPid();if(!n||!tx||!reviewStars){$('#rvErr').textContent=t('reviewErr');return}
    const bought=S.user&&S.orders.some(o=>o.phone===S.user.phone&&o.items.some(i=>i.pid===pid));
    S.reviews.unshift({id:'r'+Date.now(),pid,name:n,rating:reviewStars,text:tx,at:Date.now(),approved:false,verified:!!bought});reviewStars=0;save();rf.reset();$('#rvErr').innerHTML=`<span style="color:var(--good)">${t('reviewThanks')}</span>`};
}
function renderSuggest(){
  const box=$('#suggest');if(!box)return;const q=shop.q.trim().toLowerCase();
  if(q.length<1){box.innerHTML='';return}
  const ps=S.products.filter(p=>q.split(/\s+/).every(w=>searchText(p).includes(w))).slice(0,6);

function exportCSV(){
  const rows=[['Invoice','Date','Name','Phone','District','Address','Items','Subtotal','Delivery','Discount','Total','Status','Payment','Payment status','TrxID','Courier','Tracking','Source']];
  ordersFiltered().forEach(o=>{const d=new Date(o.createdAt);rows.push([o.inv,`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,o.name,o.phone,DIST_EN[o.district]||o.district,o.address,o.items.map(i=>itemText(i)+' x'+i.qty).join('; '),o.sub,o.delivery,o.discount,o.total,STATUS[o.status].t,o.payment?PAY[o.payment.method]:'',o.payment?PAY_ST[o.payment.status].t:'',o.payment&&o.payment.trx||'',o.courier?COURIERS[o.courier].t:'',o.tracking,o.source])});

      if(st.pixelId&&!/^\d{6,20}$/.test(st.pixelId))toast('Pixel ID শুধু সংখ্যা হবে, এটা কাজ করবে না');
      if(st.ga4Id&&!/^G-[A-Z0-9]{4,20}$/.test(st.ga4Id))toast('GA4 ID দেখতে G-XXXXXXX এর মতো হবে');
      st.flash={on:$('#fl_on').checked,title:$('#fl_title').value.trim()||'ফ্ল্যাশ সেল',titleEn:$('#fl_titleEn').value.trim(),endsAt:new Date($('#fl_end').value).getTime()||Date.now()+DAY,pids:[...document.querySelectorAll('.flp:checked')].map(x=>x.value)};
      st.banners.forEach((b,i)=>{b.title=$('#bn_t_'+i).value;b.titleEn=$('#bn_te_'+i).value;b.sub=$('#bn_s_'+i).value;b.subEn=$('#bn_se_'+i).value;b.cta=$('#bn_c_'+i).value;b.ctaEn=$('#bn_ce_'+i).value;b.cat=$('#bn_k_'+i).value;b.tint=$('#bn_x_'+i).value});
      st.pagesEn=st.pagesEn||{};for(const k of Object.keys(PAGE_TITLES)){st.pages[k]=$('#pg_'+k).value;st.pagesEn[k]=$('#pge_'+k).value}
      save();applyTheme();refreshAdmin();toast('সেটিংস সেভ হয়েছে')};
  }
}
function refreshAdmin(){const y=window.scrollY;renderAdmin(curAdminPage);window.scrollTo(0,y)}
/* ---------------- routing & events ---------------- */
let curView='home';
function route(){
  closeModal();adm.notif=false;catMenu=false;
  const h=(location.hash||'#home').slice(1);
  if(h.startsWith('admin')){const p=h.slice(6)||'overview';applyTheme();setSEO('অ্যাডমিন | '+S.settings.name,'');renderAdmin(PAGES[p]?p:'overview')}
  else if(h.startsWith('product-')){const id=h.slice(8),p=prod(id);if(curView!=='product:'+id){pdTab='desc';reviewStars=0;if(p){initBox('pd',p);S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,10);save()}}curView='product:'+id;renderShop('product',id)}
  else{const v=['home','products','track','wishlist','account','contact','about','privacy','terms','refund','thankyou'].includes(h)?h:'home';curView=v;renderShop(v)}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
const curPid=()=>curView.startsWith('product:')?curView.slice(8):null;
function rerenderShop(){const y=scrollY;if(curView.startsWith('product:'))renderShop('product',curPid());else renderShop(curView);scrollTo(0,y)}
function copyText(txt,ok){try{navigator.clipboard.writeText(txt).then(()=>toast(ok),()=>toast(t('copyFail')))}catch(e){toast(t('copyFail'))}}
const A={

  bbuy:el=>{const c=el.dataset.ctx,k=selKeyC(c);if(k===null){toast(t('pickAll'));return}const it=S.cart.find(x=>x.pid===BX[c].pid&&x.vkey===k);if(it||addToCart(BX[c].pid,k,BX[c].qty,true))showCheckout()},
  gimg:el=>{const c=el.dataset.ctx,p=prod(BX[c].pid);BX[c].img=+el.dataset.i;const m=$('#'+c+'Main');if(m)m.firstElementChild.outerHTML=pimg(p,'',BX[c].img);el.parentElement.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===BX[c].img))},
  pdtab:el=>{pdTab=el.dataset.id;rerenderShop();const tb=$('.tabs');if(tb&&el.closest('.info'))tb.scrollIntoView({behavior:'smooth'})},
  star:el=>{reviewStars=+el.dataset.id;document.querySelectorAll('[data-act="star"]').forEach(b=>b.classList.toggle('on',+b.dataset.id<=reviewStars))},
  copylink:()=>copyText(location.href,t('linkCopied')),
  wish:el=>{const id=el.dataset.id,i=S.wish.indexOf(id);if(i>=0)S.wish.splice(i,1);else S.wish.push(id);save();el.classList.toggle('on',i<0);el.setAttribute('aria-pressed',i<0);toast(i<0?t('wishAdd'):t('wishRm'));if(curView==='wishlist')renderShop('wishlist')},
  cart:()=>showCart(),checkout:()=>showCheckout(),more:()=>showMore(),
  cq:el=>{const it=S.cart[+el.dataset.i];if(!it)return;const v=variant(prod(it.pid),it.vkey);it.qty+=+el.dataset.d;if(v&&it.qty>v.stock){it.qty=v.stock;toast(t('maxStock',v.stock))}if(it.qty<=0)S.cart.splice(+el.dataset.i,1);save();updateCartBadges();showCart()},
  crm:el=>{S.cart.splice(+el.dataset.i,1);save();updateCartBadges();showCart()},
  catmenu:()=>{catMenu=!catMenu;const b=document.querySelector('.browse');if(!b)return;const m=b.querySelector('.catmenu');if(m)m.remove();if(catMenu)b.insertAdjacentHTML('beforeend',`<div class="catmenu">${S.categories.map(c=>`<button data-act="gocat" data-id="${c.id}">${catIcon(c,17)}${esc(cn(c.id))}</button>`).join('')}</div>`);b.firstElementChild.setAttribute('aria-expanded',catMenu)},
  gocat:el=>{shop.cat=el.dataset.id;shop.q='';shop.quick=[];shop.price='';shop.min='';shop.max='';closeModal();go('products')},
  quick:el=>{shop.quick=[el.dataset.id];shop.cat='';shop.q='';go('products')},
  sortpop:()=>{shop={...shop,quick:[],cat:'',q:'',sort:'pop'};go('products')},
  rmchip:el=>{const k=el.dataset.id;if(k==='cat')shop.cat='';else if(k==='q')shop.q='';else shop.quick=shop.quick.filter(x=>'q:'+x!==k);renderShop('products')},
  sugall:()=>{shop.cat='';go('products')},
  slide:el=>{showSlide(+el.dataset.id);startSlider()},
  fapply:()=>{shop.min=$('#fmin').value;shop.max=$('#fmax').value;shop.price='';renderShop('products')},
  freset:()=>{shop={...shop,q:'',cat:'',quick:[],price:'',min:'',max:''};renderShop('products')},
  trackinv:el=>{shop.trackQ=el.dataset.id;closeModal();go('track')},
  signout:()=>{S.user=null;save();renderShop('account')},
  lang:el=>{S.prefs.lang=el.dataset.id;save();closeModal();rerenderShop()},
  theme:()=>{const order=['auto','light','dark'];S.prefs.theme=order[(order.indexOf(S.prefs.theme)+1)%3];save();closeModal();applyTheme();rerenderShop();toast(t('theme')+': '+t({light:'themeLight',dark:'themeDark'}[S.prefs.theme]||'themeAuto'))},
  logout:()=>{authed=false;try{sessionStorage.removeItem('sg_admin')}catch(e){}location.hash='home'},
  range:el=>{adm.range=el.dataset.id;adm.sel.clear();refreshAdmin()},
  notif:()=>{adm.notif=!adm.notif;refreshAdmin()},
  markread:()=>{S.lastSeen=Date.now();adm.notif=false;save();refreshAdmin()},
  ostatus:el=>{adm.status=el.dataset.id;adm.sel.clear();refreshAdmin()},
  gostatus:el=>{adm.status=el.dataset.id;adm.range='all';location.hash='admin-orders'},
  openOrder:el=>orderDrawer(el.dataset.id),
  custorders:el=>{adm.q=el.dataset.id;adm.status='all';adm.range='all';location.hash='admin-orders'},
  sel:(el,e)=>{const id=el.dataset.id;el.checked?adm.sel.add(id):adm.sel.delete(id);el.closest('tr').classList.toggle('sel',el.checked);renderBulk()},
  selall:el=>{const l=ordersFiltered();if(el.checked)l.forEach(o=>adm.sel.add(o.id));else adm.sel.clear();renderOrdersTable()},
  clearsel:()=>{adm.sel.clear();renderOrdersTable()},
  bulkSt:()=>{const s=$('#bulkSt').value;if(!s){toast('আগে একটা স্ট্যাটাস বাছুন');return}const n=adm.sel.size;adm.sel.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o)setStatus(o,s,s==='cancelled'?'একসাথে ক্যানসেল করা':'')});adm.sel.clear();save();toast(`${n}টি অর্ডার ${STATUS[s].t} করা হয়েছে`);refreshAdmin()},
  bulkC:()=>{const c=$('#bulkC').value;let n=0,skip=0;adm.sel.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o&&['pending','confirmed','hold','ready'].includes(o.status)&&!o.tracking){sendToCourier(o,c);n++}else skip++});adm.sel.clear();save();toast(`${n}টি অর্ডার ${COURIERS[c].t}-এ পাঠানো হয়েছে${skip?`, ${skip}টি বাদ (আগেই পাঠানো বা বন্ধ)`:''}`);refreshAdmin()},
  invoices:()=>showInvoices([...adm.sel]),inv1:el=>showInvoices([el.dataset.id]),
  csv:()=>exportCSV(),
  print:()=>{try{window.print()}catch(e){toast('এই প্রিভিউতে প্রিন্ট বন্ধ, লাইভ সাইটে কাজ করবে')}},
  newOrder:()=>newOrderForm(),
  oact:el=>orderAction(el.dataset.id,el.dataset.s),
  payst:el=>{const o=S.orders.find(x=>x.id===el.dataset.id);if(!o||!o.payment)return;o.payment.status=el.dataset.s;o.history.push({s:'note',by:meName(),at:Date.now(),note:`পেমেন্ট: ${PAY_ST[el.dataset.s].t}`});save();toast('পেমেন্ট আপডেট হয়েছে');refreshAdmin();orderDrawer(o.id)},
  copymsg:el=>copyText(el.dataset.msg,'মেসেজ কপি হয়েছে'),
  addnote:el=>{const v=$('#noteIn').value.trim();if(!v)return;const o=S.orders.find(x=>x.id===el.dataset.id);o.history.push({s:'note',by:meName(),at:Date.now(),note:v});save();orderDrawer(o.id)},
  retst:el=>{const o=S.orders.find(x=>x.id===el.dataset.id);if(!o.ret)o.ret={type:'return',reason:'—',st:'requested',at:Date.now()};o.ret.st=el.dataset.s;o.history.push({s:'note',by:meName(),at:Date.now(),note:RET_ST[el.dataset.s]});save();toast(RET_ST[el.dataset.s]);refreshAdmin()},
  incf:el=>{incFilter=el.dataset.id;refreshAdmin()},
  incconv:el=>incConvert(el.dataset.id),
  incst:el=>{const x=S.incomplete.find(d=>d.id===el.dataset.id);if(!x)return;x.status=el.dataset.s;x.log.push({t:{contacted:'ফোন করা হয়েছে',dropped:'বাদ দেওয়া হয়েছে',new:'আবার খোলা হয়েছে'}[el.dataset.s],by:meName(),at:Date.now()});x.updated=Date.now();save();refreshAdmin()},
  incmsg:el=>{const x=S.incomplete.find(d=>d.id===el.dataset.id);const m=`আসসালামু আলাইকুম${x.name?' '+x.name:''}, ${S.settings.name} থেকে বলছি। আপনি আমাদের সাইটে ${x.items.map(itemText).join(', ')} অর্ডার করতে চেয়েছিলেন, কিন্তু অর্ডারটি সম্পূর্ণ হয়নি। কোনো সমস্যা হয়ে থাকলে জানান, আমরা এখনই অর্ডারটি নিয়ে নিতে পারি। ক্যাশ অন ডেলিভারি।`;copyText(m,'মেসেজ কপি হয়েছে, হোয়াটসঅ্যাপে পেস্ট করুন')},
  msgread:el=>{const m=S.messages.find(x=>x.id===el.dataset.id);if(m)m.read=true;save();refreshAdmin()},
  revst:el=>{const r=S.reviews.find(x=>x.id===el.dataset.id);if(!r)return;if(el.dataset.s==='del'){S.reviews=S.reviews.filter(x=>x!==r);toast('রিভিউ মুছে ফেলা হয়েছে')}else{r.approved=el.dataset.s==='on';toast(r.approved?'রিভিউ প্রকাশিত হয়েছে':'রিভিউ লুকানো হয়েছে')}save();refreshAdmin()},
  revf:el=>{revFilter=el.dataset.id;refreshAdmin()},
  pedit:el=>productForm(el.dataset.id),
  pdel:el=>{const p=prod(el.dataset.id);askConfirm(`"${esc(p.name)}" মুছে ফেলবেন? আগের অর্ডারে নামটা থেকে যাবে।`,()=>{S.products=S.products.filter(x=>x!==p);S.cart=S.cart.filter(x=>x.pid!==p.id);S.wish=S.wish.filter(x=>x!==p.id);save();refreshAdmin();toast('প্রোডাক্ট মুছে ফেলা হয়েছে')},'মুছে ফেলুন')},
  csave:el=>{const c=S.categories.find(x=>x.id===el.dataset.id),v=$('#cn_'+c.id).value.trim();if(!v)return;c.name=v;c.nameEn=$('#ce_'+c.id).value.trim();c.icon=$('#ci_'+c.id).value;c.tint=$('#ct_'+c.id).value;save();refreshAdmin();toast('ক্যাটাগরি সেভ হয়েছে')},

};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(adm.notif&&!e.target.closest('.notif')&&!(el&&el.dataset.act==='notif')){adm.notif=false;const n=$('.notif');if(n)n.remove()}
  if(catMenu&&!e.target.closest('.browse')){catMenu=false;const m=$('.catmenu');if(m)m.remove()}
  if(!e.target.closest('.searchbox')){const sg=$('#suggest');if(sg)sg.innerHTML=''}
  if(!el)return;
  if(el.dataset.act==='scrim'){if(e.target===el)closeModal();return}
  const f=A[el.dataset.act];
  if(el.tagName==='A'){if(el.dataset.act==='close')closeModal();else if(f)f(el,e);return}
  if(!f)return;
  if(el.tagName!=='INPUT')e.preventDefault();
  f(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.ch;if(!k)return;
  if(k==='fcat'){shop.cat=el.value;renderShop('products')}
  else if(k==='fquick'){shop.quick=[...document.querySelectorAll('[data-ch="fquick"]:checked')].map(x=>x.value);renderShop('products')}
  else if(k==='fprice'){shop.price=el.value;shop.min='';shop.max='';renderShop('products')}
  else if(k==='fsort'){shop.sort=el.value;renderProductGrid()}
  else if(k==='ocourier'){adm.courier=el.value;adm.sel.clear();refreshAdmin()}
  else if(k==='pcat'){adm.pcat=el.value;renderProductsTable()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#overlay').innerHTML)closeModal();const sg=$('#suggest');if(sg)sg.innerHTML=''}});
applyTheme();loadTrackers();route();
